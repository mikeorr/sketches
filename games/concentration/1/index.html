    <details>

        <h1>How to play</h1>
        <p>
          <strong>Concentration</strong> ....
        </p>

        <h1>About Concentration</h1>

        <p>
          Concentration was created by Mike Orr.
        </p>
        <p>
          Version 3 is written in modern vanilla Javascript and CSS.
          The only library is
          <a href="https://www.npmjs.com/package/random-seedable"
          target="_blank"><code>random-seedable</code></a>
          by Chris Akroyd
          to shuffle the cards.
