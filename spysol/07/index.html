<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Spider-like card game" />
    <title>Spysol</title>
    <link rel="stylesheet" href="styles.css" type="text/css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>

    <noscript><p>This Spider-like card game requires Javascript.</p></noscript>

    <main class="border">
      <nav id="sidebar" class="border">
        <div class="app-title">SPYSOL</div>
        <button id="btn-colors">Change Colors</button>
        <button id="btn-new">New Game</button>
      </nav>
      <div id="tableau" class="border">
      </div>
    </main>

    <div id="models" class="border">
      <span>Models</span>
      <div>
          <spy-model id="model1"></spy-model>
          <spy-model id="model2"></spy-model>
      </div>
    </div>

    <details>
      <summary>Help</summary>

      <div class="help-box">
      </div>
    </details>

  </body>
</html>
