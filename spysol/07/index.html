<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Spider-like card game" />
    <title>Spysol</title>
    <link rel="stylesheet" href="styles.css" type="text/css" />
  </head>
  <body>

    <noscript><p>This Spider-like card game requires Javascript.</p></noscript>

    <main class="border">
      <nav class="border">
        <div>SPYSOL</div>
      </nav>
      <div id="tableau" class="border">
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
      </div>
    </main>

    <div id="models" class="border">
      <span>Models:</span>
      <span id="model1" class="model">
        <spy-card suit="1" rank="1">A</spy-card>
        <spy-card suit="1" rank="2">2</spy-card>
        <spy-card suit="1" rank="3">3</spy-card>
        <spy-card suit="1" rank="4">4</spy-card>
        <spy-card suit="1" rank="5">5</spy-card>
        <spy-card suit="1" rank="6">6</spy-card>
        <spy-card suit="1" rank="7">7</spy-card>
        <spy-card suit="1" rank="8">8</spy-card>
        <spy-card suit="1" rank="9">9</spy-card>
        <spy-card suit="1" rank="10">10</spy-card>
        <spy-card suit="1" rank="11">J</spy-card>
        <spy-card suit="1" rank="12">Q</spy-card>
        <spy-card suit="1" rank="13">K</spy-card>
      </span>
      <span id="model2" class="model">
        <spy-card suit="2" rank="1">A</spy-card>
        <spy-card suit="2" rank="2">2</spy-card>
        <spy-card suit="2" rank="3">3</spy-card>
        <spy-card suit="2" rank="4">4</spy-card>
        <spy-card suit="2" rank="5">5</spy-card>
        <spy-card suit="2" rank="6">6</spy-card>
        <spy-card suit="2" rank="7">7</spy-card>
        <spy-card suit="2" rank="8">8</spy-card>
        <spy-card suit="2" rank="9">9</spy-card>
        <spy-card suit="2" rank="10">10</spy-card>
        <spy-card suit="2" rank="11">J</spy-card>
        <spy-card suit="2" rank="12">Q</spy-card>
        <spy-card suit="2" rank="13">K</spy-card>
      </span>
    </div>

    <details>
      <summary>Help</summary>

      <div class="help-box">
      </div>
    </details>

  </body>
  <script type="module" src="main.js"></script>
</html>
