<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Yahtzee-like game" />
    <title>Yacht</title>
    <link rel="stylesheet" href="styles.css" type="text/css" />
  </head>
  <body>

    <noscript>
      <p>This Yahtzee-like card game requires Javascript.</p>
    </noscript>

    <details>
      <summary>Yacht Help</summary>

      <div>
        <h1>How to play</h1>
        <p>
          <strong>Yacht</strong> is a dice game similar to Yahtzee.
        </p>

        <h1>About Yacht</h1>

        <p>
          Yacht was created by Mike Orr.
          This is version 1.
        </p>
        <p>
          Version 1 is written in modern vanilla Javascript and CSS.
          The only library is
          <a href="https://www.npmjs.com/package/random-seedable"
          target="_blank"><code>random-seedable</code></a>
          by Chris Akroyd
          to roll the dice.
        </p>

      </div>

    </details>

    <section id="tray" class="tray">
    </section>

    <nav>
        <button id="btn-roll">Roll</button>
    </nav>

  <script type="module" src="main.js"></script>
  </body>
</html>
