<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tea timer utility" />
    <title>Tea Timer</title>
    <link rel="stylesheet" href="styles.css" type="text/css" />
  </head>
  <body class="cursive">

    <h1>Tea Timer</h1>

    <noscript>
      <p>This timer utility requires Javascript.</p>
    </noscript>

    <main>
        <div id="input-row">
          <label><input id="minutes" type="number" /> minutes</label>
          <div>
            <button id="start">Start</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
          </div>
        </div>
        <div class="state">
          <time>0:00</time>
          <progress value="0"></progress>
        </div>
    </main>

    <nav>
    </nav>

    <details>
      <summary>Help</summary>

      <div class="help-box">
        <h1>How to play</h1>
        <h1>About Tea Timer</h1>

        <p>
          Tea Timer was created by Mike Orr.
          This is version 1.
          It's written in modern vanilla Javascript and CSS.
        </p>

      </div>

    </details>

  <script type="module" src="main.js"></script>
  </body>
</html>
